buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
        // Single source for the ABIs everything builds, read from gradle.properties so the
        // app and the local native modules cannot drift apart. Named differently from the
        // gradle.properties key so the two do not shadow one another.
        nativeArchitectures = (findProperty("reactNativeArchitectures") ?: "armeabi-v7a,arm64-v8a")
                .toString().split(",").collect { it.trim() }.findAll { it }
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs "$rootDir/libs"
        }
    }
    
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                substitute module('com.arthenica:ffmpeg-kit-https') using project(':ffmpeg-lib')
                substitute module('com.arthenica:ffmpeg-kit-min') using project(':ffmpeg-lib')
                substitute module('com.arthenica:ffmpeg-kit-min-gpl') using project(':ffmpeg-lib')
                substitute module('com.arthenica:ffmpeg-kit-full') using project(':ffmpeg-lib')
                substitute module('com.arthenica:ffmpeg-kit-full-gpl') using project(':ffmpeg-lib')
            }
        }
    }
}

// Third-party native modules pin their own compileSdk, and a stale one now fails the
// build outright: react-native-ffmpeg-kit compiles against android-33, while
// react-android 0.87.1 and androidx.appcompat 1.7 both require their consumers to compile
// against 34 or later, so checkReleaseAarMetadata rejects it.
//
// Raising compileSdk only widens the API surface a library may reference; it does not
// change minSdk or opt anything into new runtime behaviour, so it is safe to apply
// uniformly. Doing it here rather than patching node_modules keeps the fix surviving
// npm install, and covers the next module that lags rather than only this one.
subprojects { subproject ->
    afterEvaluate {
        if (subproject.plugins.hasPlugin("com.android.library")
                || subproject.plugins.hasPlugin("com.android.application")) {
            subproject.android {
                // Raise only. Setting it unconditionally would silently downgrade a module
                // that legitimately pins something higher than the app does.
                if (compileSdk == null || compileSdk < rootProject.ext.compileSdkVersion) {
                    compileSdk rootProject.ext.compileSdkVersion
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"