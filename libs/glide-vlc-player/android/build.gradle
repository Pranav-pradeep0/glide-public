apply plugin: 'com.android.library'
android {
    namespace 'com.yuanzhou.vlc'
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        consumerProguardFiles("proguard-rules.pro")
        ndk {
            abiFilters 'armeabi-v7a','x86_64','arm64-v8a','x86'
        }
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}
buildscript {
    repositories {
        google()
        mavenCentral()
        // maven { url "https://maven.appspector.com/artifactory/android-sdk" }

    }
    dependencies {
        classpath("com.android.tools.build:gradle:4.0.2")
    }
}

repositories {
    maven {
        url "https://mvnrepository.com/artifact/org.videolan.android"
    }
    google()
    mavenCentral()
}

dependencies {
    // The PiP controller needs ComponentActivity.addOnPictureInPictureModeChangedListener,
    // which landed in androidx.activity 1.8.0. React Native pins the app to the same
    // version, so this does not change what ships.
    implementation 'androidx.activity:activity:1.8.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "com.facebook.react:react-native:+"
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    // Legacy media session, still used until the Media3 service owns the session.
    implementation 'androidx.media:media:1.6.0'
    // Media3 owns the media session, its notification, and media button handling.
    // Pinned to 1.7.1. Verified 2026-08-27: 1.11.0 needs compileSdk 36 AND Kotlin 2.x
    // (it pulls kotlin-stdlib 2.2.10, this project is on 1.9.24), which is exactly the
    // AGP 9 / Kotlin 2.2 migration in tracker section 10.2. Raise it with that, not before.
    implementation 'androidx.media3:media3-session:1.7.1'
    implementation 'androidx.media3:media3-common:1.7.1'
}
