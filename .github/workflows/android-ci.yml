name: Android CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, lint, tests, debug build)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Create .env file
        run: |
          cat << EOF > .env
          SUBDL_API_KEY=${{ secrets.SUBDL_API_KEY }}
          SUBDL_API_URL=${{ secrets.SUBDL_API_URL }}
          SUBDL_DOWNLOAD_URL=${{ secrets.SUBDL_DOWNLOAD_URL }}
          OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          OMDB_API_URL=${{ secrets.OMDB_API_URL }}
          GITHUB_OWNER=Pranav-pradeep0
          GITHUB_REPO=glide-public
          STALLION_PROJECT_ID=${{ secrets.STALLION_PROJECT_ID }}
          STALLION_APP_TOKEN=${{ secrets.STALLION_APP_TOKEN }}
          EOF

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx jest --ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Compile debug build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

  release:
    name: Release (tag-gated)
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: production-release
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and version identity
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"

          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not a strict final version (expected vX.Y.Z). Prerelease/build suffixes are rejected."
            exit 1
          fi

          # A tag on a develop commit must never publish as a production release.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not an ancestor of origin/main. Production releases are cut from main only."
            exit 1
          fi

          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version '$VERSION' does not equal package.json version '$PKG_VERSION'."
            exit 1
          fi

          # Old public tags used vX.Y.Z-build.N. Compare their SemVer portion too, so a
          # strict tag cannot silently reuse an installed version such as 1.8.1.
          PREVIOUS_VERSION=$(git tag --list \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-build\.[0-9]+)?$' \
            | grep -Fvx "$TAG" \
            | sed -E 's/^v//; s/-build\.[0-9]+$//' \
            | sort -V \
            | tail -n 1)
          if [ -n "$PREVIOUS_VERSION" ]; then
            NEWEST_VERSION=$(printf '%s\n%s\n' "$PREVIOUS_VERSION" "$VERSION" | sort -V | tail -n 1)
            if [ "$NEWEST_VERSION" != "$VERSION" ] || [ "$PREVIOUS_VERSION" = "$VERSION" ]; then
              echo "::error::Version '$VERSION' must be greater than public version '$PREVIOUS_VERSION'."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$TAG' already exists. Never rebuild a public version in place; bump the patch version."
            exit 1
          fi

          if [[ "$AI_PROXY_URL" != https://* ]]; then
            echo "::error::Repository variable AI_PROXY_URL must contain the HTTPS production Worker URL."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Create .env file
        run: |
          cat << EOF > .env
          SUBDL_API_KEY=${{ secrets.SUBDL_API_KEY }}
          SUBDL_API_URL=${{ secrets.SUBDL_API_URL }}
          SUBDL_DOWNLOAD_URL=${{ secrets.SUBDL_DOWNLOAD_URL }}
          OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          OMDB_API_URL=${{ secrets.OMDB_API_URL }}
          AI_PROXY_URL=$AI_PROXY_URL
          GITHUB_OWNER=Pranav-pradeep0
          GITHUB_REPO=glide-public
          STALLION_PROJECT_ID=${{ secrets.STALLION_PROJECT_ID }}
          STALLION_APP_TOKEN=${{ secrets.STALLION_APP_TOKEN }}
          EOF

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/glide-release.keystore
          if [ ! -s android/app/glide-release.keystore ]; then
            echo "Error: Decoded keystore is empty"
            exit 1
          fi

      - name: Build signed APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE="glide-release.keystore" \
            -PMYAPP_UPLOAD_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Collect assets and checksums
        run: |
          set -e
          APK_DIR="android/app/build/outputs/apk/release"

          ARM_SRC="$APK_DIR/app-armeabi-v7a-release.apk"
          ARM64_SRC="$APK_DIR/app-arm64-v8a-release.apk"
          ARM_DEST="$APK_DIR/Glide-v${VERSION}-arm.apk"
          ARM64_DEST="$APK_DIR/Glide-v${VERSION}-arm64.apk"

          mv "$ARM_SRC" "$ARM_DEST"
          mv "$ARM64_SRC" "$ARM64_DEST"

          sha256sum "$ARM_DEST"  > "${ARM_DEST}.sha256"
          sha256sum "$ARM64_DEST" > "${ARM64_DEST}.sha256"

          echo "ARM_PATH=$ARM_DEST" >> "$GITHUB_ENV"
          echo "ARM64_PATH=$ARM64_DEST" >> "$GITHUB_ENV"

      - name: Generate changelog from previous final release
        run: |
          set -e
          LAST_TAG=$(git tag --list --sort=-creatordate \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-build\.[0-9]+)?$' \
            | grep -Fvx "$TAG" \
            | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
            echo "No previous final tag found. Using full history."
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          RAW_LOG=$(git log --no-merges --pretty=format:"%s" $RANGE)
          FEATS=$(echo "$RAW_LOG" | sed -nE 's/^(feat)(\([^)]*\))?:\s*/- /p')
          FIXES=$(echo "$RAW_LOG" | sed -nE 's/^(fix)(\([^)]*\))?:\s*/- /p')
          PERFS=$(echo "$RAW_LOG" | sed -nE 's/^(perf)(\([^)]*\))?:\s*/- /p')

          BODY=""
          if [ -n "$FEATS" ]; then
            BODY="${BODY}"$'\n'"### Features"$'\n'"$FEATS"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}"$'\n'"### Fixes"$'\n'"$FIXES"
          fi
          if [ -n "$PERFS" ]; then
            BODY="${BODY}"$'\n'"### Performance"$'\n'"$PERFS"
          fi

          if [ -z "$BODY" ]; then
            LOG=$(echo "$RAW_LOG" | sed -nE 's/^/- /p')
            if [ -z "$LOG" ]; then
              LOG="- No notable changes."
            fi
            BODY="$LOG"
          else
            BODY=$(echo "$BODY" | sed '1{/^$/d}')
          fi

          {
            echo "$BODY"
            echo ""
            echo "---"
            echo "**Build Info**"
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            echo "- Date: \`$(date +'%Y-%m-%d')\`"
          } > release_notes.md

      - name: Create GitHub Release
        run: |
          set -e
          test -f "$ARM_PATH" || { echo "::error::Missing ARM APK"; exit 1; }
          test -f "$ARM64_PATH" || { echo "::error::Missing ARM64 APK"; exit 1; }

          gh release create "$TAG" \
            --title "Glide ${VERSION}" \
            --notes-file release_notes.md \
            --verify-tag \
            "$ARM_PATH" "${ARM_PATH}.sha256" \
            "$ARM64_PATH" "${ARM64_PATH}.sha256"
